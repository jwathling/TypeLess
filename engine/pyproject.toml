[project]
name = "typeless-engine"
version = "0.1.0"
description = "Lokale STT- + LLM-Engine für die TypeLess-Diktier-App (headless, austauschbare Backends)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Nur auf Apple Silicon installierbar/lauffähig (Metal). Auf Linux bewusst nicht in den
# Kern-Dependencies, damit `uv sync` überall durchläuft.
mlx = [
    "mlx-whisper>=0.4",
    "mlx-lm>=0.19",
]
# Sidecar-Server (M2).
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
typeless = "typeless_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typeless_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer nutzt Funktionsaufrufe (Option/Argument) als Default-Werte — bewusstes Pattern.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# MLX-Pakete haben keine Typ-Stubs und sind auf Linux nicht installiert.
[[tool.mypy.overrides]]
module = ["mlx_whisper.*", "mlx_lm.*", "mlx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "slow: Tests, die echte MLX-Modelle laden (nur Apple Silicon).",
]
testpaths = ["tests"]
